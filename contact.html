<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – La Boutique du Geek</title>
<meta name="description" content="Contactez La Boutique du Geek par e-mail.">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="contact">

<header>
  <h1><a href="/" id="h1">La Boutique du <span>Geek</span></a></h1>
  <p class="tag" id="tagline">Jeux, goodies et objets de collection d'occasion</p>
  <nav id="nav" aria-label="Menu"></nav>
  <div class="shops" id="shops"></div>
</header>

<main class="container">
  <div class="adslot" id="ad" hidden></div>

  <div class="contact sec">
    <h2>Me contacter</h2>
    <div class="md" id="ctext"></div>
    <a class="btn" id="mailbtn">✉️ Envoyer un e-mail</a>
    <p id="mailtxt"></p>
  </div>
  <p class="err" id="err" hidden>Impossible de charger la page pour le moment. Réessayez dans un instant.</p>
</main>

<footer>
  <p id="footer">© La Boutique du Geek – Les achats se font sur les plateformes Leboncoin, Vinted et eBay.</p>
  <p><button class="linkbtn" id="cookiebtn" hidden>Gérer les cookies</button></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
